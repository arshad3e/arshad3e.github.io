<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Job Search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--soft:#E8ECF0;--ink:#18212F;--muted:#556170;--line:#D4DAE1;--copper:#A8541F;--copper-soft:#F4E4D8;--teal:#1F6F6B;--teal-soft:#DCEDEB;--done:#2F7D4F;--done-soft:#DDEFE3;
 --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F141A;--surface:#161D25;--soft:#1C2530;--ink:#E3E8EE;--muted:#97A3B1;--line:#2A3440;--copper:#E48A4E;--copper-soft:#3A2618;--teal:#55B8B0;--teal-soft:#16302E;--done:#5CC08A;--done-soft:#17301F;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto;padding-block:28px 72px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,7vw,52px)}h2{font-size:30px}h3{font-size:22px}h4{font-size:18px}
p,ul,ol,dl{margin:0}ul,ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
a{color:var(--teal)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--copper)}
.top{display:flex;flex-direction:column;gap:12px}.lede{color:var(--muted);max-width:66ch}
.ivnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ivnav a{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.ivnav a span{font-size:12.5px;color:var(--muted)}
.iv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px;min-width:0}
.iv-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.drop{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.drop:hover{border-color:var(--copper);color:var(--copper)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;font-size:13.5px;max-width:320px;text-align:right}
.confirm button{font:inherit;font-size:13px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.confirm button.yes{background:var(--copper);border-color:var(--copper);color:var(--surface)}
.byyou{display:flex;flex-direction:column;gap:8px}.byyou div{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.byyou button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);cursor:pointer}
.pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:3px;white-space:nowrap}
.pill.upcoming{background:var(--copper-soft);color:var(--copper)}.pill.waiting{background:var(--teal-soft);color:var(--teal)}.pill.dormant{background:var(--soft);color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.facts dt{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.facts dd{margin:0}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.why{background:var(--teal-soft);border-radius:6px;padding:12px 14px;max-width:75ch}
.watch{display:grid;gap:10px}.watch div{border-left:3px solid var(--copper);padding:4px 0 4px 12px}.watch p{color:var(--ink);margin-top:2px}
.qa{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px}
.qa details{border-bottom:1px solid var(--line);padding:11px 14px}.qa details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:500}.ans{margin-top:8px;padding-left:12px;border-left:3px solid var(--teal);white-space:pre-line;max-width:75ch}
.hint{color:var(--muted);font-size:14px}
.jd{display:flex;flex-direction:column;gap:10px}.jd-sec{margin-top:8px;color:var(--copper)}
.jd-row{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border-radius:6px}
.jd-line{font-size:14.5px;color:var(--muted)}.jd-line::before{content:"JD  ";font-family:var(--mono);font-size:11px;color:var(--copper)}
.jd-ans{max-width:75ch}.jd-ans::before{content:"YOU  ";font-family:var(--mono);font-size:11px;color:var(--teal)}
.closed table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}.closed th,.closed td{text-align:left;padding:8px 10px;border:1px solid var(--line);vertical-align:top}
.closed th{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px}.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:600}.stats span{font-size:12px;color:var(--muted)}
.num{font-family:var(--mono);font-size:13px;white-space:nowrap}.soon{font-family:var(--mono);font-size:11px;color:var(--copper);margin-left:6px}
.lock{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
.lock input[type=password]{font:15px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);width:100%}
.lock button{font:inherit;font-weight:500;padding:9px 14px;border:0;border-radius:5px;background:var(--teal);color:var(--surface);cursor:pointer}
.lock label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}.err{color:var(--copper);font-size:14px}
@media (max-width:640px){.iv-head{flex-direction:column}.head-r{align-items:flex-start}.confirm{justify-content:flex-start;text-align:left}.stats{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}.iv{padding:16px}}
</style></head><body>
<form class="lock" id="lock"><div class="eyebrow">Private</div><h2>Jobs</h2>
<input type="password" id="pw" placeholder="Passphrase" autocomplete="current-password" aria-label="Passphrase">
<label><input type="checkbox" id="keep"> Remember on this device</label>
<button type="submit">Unlock</button><p class="err" id="err" hidden>That passphrase did not work.</p></form>
<main id="out" hidden></main>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(BLOB.s),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(BLOB.i)},key,d64(BLOB.c)));
}
/* "Not moving forward": hide a role now, remember it on this device, and sync it to the private prep-sync repo
   when this browser has the sync token (shared with /learn). The next rebuild marks it rejected in the tracker. */
const CL_API="https://api.github.com/repos/arshad3e/prep-sync/contents/jobs_closed.json";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let closedMap=ls.get("jobs.closed",{}),clSha=null;
const tok=()=>{try{return localStorage.getItem("p60sync.token")}catch(e){return null}};
const hdr=()=>({"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok()});
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,""))));
function note(t){const n=document.getElementById("syncNote");if(n)n.textContent=t}
function mergeIn(remote){for(const[k,v]of Object.entries(remote||{}))if(!closedMap[k]||(v.at||0)>(closedMap[k].at||0))closedMap[k]=v}
async function clPull(){if(!tok())return false;const r=await fetch(CL_API+"?t="+Date.now(),{headers:hdr(),cache:"no-store"});
  if(r.status===404){clSha=null;return true}if(!r.ok)throw new Error("read "+r.status);const j=await r.json();clSha=j.sha;mergeIn(JSON.parse(b64d(j.content)).closed);ls.set("jobs.closed",closedMap);return true}
async function clPush(){if(!tok()){note("Saved on this device. It syncs to your other devices once sync is connected on /learn.");return}
  try{await clPull();const put=()=>fetch(CL_API,{method:"PUT",headers:Object.assign(hdr(),{"Content-Type":"application/json"}),
    body:JSON.stringify({message:"jobs: owner update",content:b64e(JSON.stringify({closed:closedMap},null,1)),sha:clSha||undefined})});
    let r=await put();if(r.status===409||r.status===422){await clPull();r=await put()}if(!r.ok)throw new Error("save "+r.status);
    clSha=(await r.json()).content.sha;note("Synced to all your devices.")}catch(e){note("Saved on this device; sync failed ("+e.message+").")}}
function applyClosed(){
  const list=document.getElementById("byYouList"),sec=document.getElementById("byYou");if(!list)return;list.innerHTML="";let n=0,open=0;
  document.querySelectorAll("article.iv").forEach(a=>{const c=closedMap[a.id]&&closedMap[a.id].closed;a.hidden=!!c;
    const nav=document.querySelector('[data-nav="'+a.id+'"]');if(nav)nav.hidden=!!c;
    if(c){n++;const name=a.querySelector(".drop").dataset.name;const row=document.createElement("div");
      row.innerHTML='<span></span><button type="button" data-undo="'+a.id+'">Undo</button>';row.querySelector("span").textContent=name;list.appendChild(row)}else open++});
  sec.hidden=n===0;const o=document.getElementById("nOpen");if(o)o.textContent=open}
function setClosed(id,on){closedMap[id]={closed:on,at:Date.now()};ls.set("jobs.closed",closedMap);applyClosed();clPush()}
document.addEventListener("click",ev=>{
  const d=ev.target.closest(".drop");
  if(d){const box=document.createElement("div");box.className="confirm";
    box.innerHTML='<span>They are not moving forward?</span><button type="button" class="yes">Yes, remove it</button><button type="button" class="no">Keep</button>';
    d.replaceWith(box);box.querySelector(".no").onclick=()=>box.replaceWith(d);box.querySelector(".yes").onclick=()=>{box.replaceWith(d);setClosed(d.dataset.drop,true)};return}
  const u=ev.target.closest("[data-undo]");if(u)setClosed(u.dataset.undo,false);
});
async function unlock(p,keep){
  try{const h=await open(p);const out=document.getElementById("out");out.innerHTML=h;out.hidden=false;document.getElementById("lock").hidden=true;
    applyClosed();clPull().then(ok=>{if(ok){applyClosed();note("Synced to all your devices.")}}).catch(()=>{});
    if(keep)try{localStorage.setItem("iv.pass",p)}catch(e){}
    if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}return true}
  catch(e){return false}
}
